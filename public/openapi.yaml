openapi: 3.0.1
info:
  version: "v1"
  title: "github-sigint-priv API"
  description: "Authenticated GitHub inventory collection and AI summarization."
servers:
  - url: "http://localhost:3000"
paths:
  /api/github/private-summary:
    get:
      operationId: getPrivateGithubSummary
      summary: "Get an authenticated GitHub inventory summary"
      description: "Enumerate repositories accessible to the configured user token or GitHub App installation and aggregate the resulting owner/repo metrics."
      parameters:
        - in: query
          name: owner
          required: false
          description: Optional owner or organization login to scope the inventory.
          schema:
            type: string
      responses:
        "200":
          description: "Successfully retrieved inventory information."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventorySummary"
components:
  schemas:
    InventorySummary:
      type: object
      properties:
        collectedAt:
          type: string
          format: date-time
        authMode:
          type: string
          enum: [user-token, app-installation]
        ownerFilter:
          type: string
        totals:
          $ref: "#/components/schemas/Totals"
        owners:
          type: array
          items:
            $ref: "#/components/schemas/OwnerSummary"
        repositories:
          type: array
          items:
            $ref: "#/components/schemas/Repository"
    Totals:
      type: object
      properties:
        owners:
          type: integer
        totalRepos:
          type: integer
        privateRepos:
          type: integer
        publicRepos:
          type: integer
        internalRepos:
          type: integer
        archivedRepos:
          type: integer
        forkRepos:
          type: integer
        totalSize:
          type: integer
        topLanguages:
          type: object
          additionalProperties:
            type: integer
    OwnerSummary:
      type: object
      properties:
        owner:
          type: string
        totalRepos:
          type: integer
        privateRepos:
          type: integer
        publicRepos:
          type: integer
        internalRepos:
          type: integer
        archivedRepos:
          type: integer
        forkRepos:
          type: integer
        totalSize:
          type: integer
        topLanguages:
          type: object
          additionalProperties:
            type: integer
        topTopics:
          type: object
          additionalProperties:
            type: integer
        defaultBranches:
          type: object
          additionalProperties:
            type: integer
        recentRepos:
          type: array
          items:
            type: string
    Repository:
      type: object
      properties:
        fullName:
          type: string
        owner:
          type: string
        visibility:
          type: string
          enum: [public, private, internal]
        fork:
          type: boolean
        archived:
          type: boolean
        defaultBranch:
          type: string
        size:
          type: integer
        language:
          type: string
        topics:
          type: array
          items:
            type: string
        mirror_url:
          type: string
          description: The mirror URL of the repository.
        archived:
          type: boolean
          description: Indicates if the repository is archived.
        disabled:
          type: boolean
          description: Indicates if the repository is disabled.
        open_issues_count:
          type: integer
          description: The count of open issues in the repository.
        license:
          type: object
          description: The license of the repository.
          properties:
            key:
              type: string
            name:
              type: string
            spdx_id:
              type: string
            url:
              type: string
            node_id:
              type: string
        allow_forking:
          type: boolean
          description: Indicates if forking is allowed for the repository.
        is_template:
          type: boolean
          description: Indicates if the repository is a template.
        topics:
          type: array
          items:
            type: string
          description: The topics of the repository.
        visibility:
          type: string
          description: The visibility of the repository.
        forks:
          type: integer
          description: The number of forks of the repository.
        open_issues:
          type: integer
          description: The number of open issues in the repository.
        watchers:
          type: integer
          description: The number of watchers of the repository.
        default_branch:
          type: string
          description: The default branch of the repository.
        network_count:
          type: integer
          description: The network count of the repository.
        subscribers_count:
          type: integer
          description: The subscribers count of the repository.
        stargazerData:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date-time
              count:
                type: integer
              tag:
                type: string
        readme:
          type: string
          description: The README of the repository.
